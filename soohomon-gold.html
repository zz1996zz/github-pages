    user-select:none; overflow:hidden;
  }
  .gb {
    background: linear-gradient(160deg, #e8c95a 0%, #d4a937 45%, #b8892a 100%);
    border-radius: 18px 18px 60px 18px;
    padding: 16px 18px 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.5), inset 0 -4px 8px rgba(90,60,0,.4);

  }
  .gb-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .gb-brand { font-weight:900; font-style:italic; color:#5a4205; font-size:13px; letter-spacing:1px; }
  .gb-power { display:flex; align-items:center; gap:5px; font-size:9px; color:#6b5210; font-weight:700;}
  .led { width:8px; height:8px; border-radius:50%; background:#ff3b30; box-shadow:0 0 6px #ff3b30; }
  .bezel {
    background:#3a3142; border-radius:10px 10px 34px 10px; padding:14px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.7);
  }
  canvas {
    display:block; width:100%; aspect-ratio:10/9;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background:#9bbc0f; border-radius:4px;
  }
  .controls { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
  .dpad { position:relative; width:120px; height:120px; }
  .dbtn {
    position:absolute; width:40px; height:40px; background:#33281a;
    border:none; border-radius:6px; box-shadow:0 3px 0 #1a130a; cursor:pointer;
    color:#c9a; display:flex; align-items:center; justify-content:center; font-size:14px; color:#8c7a55;
  }

  .d-up{left:40px;top:0;} .d-down{left:40px;top:80px;} .d-left{left:0;top:40px;} .d-right{left:80px;top:40px;}
  .d-mid{left:40px;top:40px; background:#33281a; box-shadow:none; pointer-events:none;}
  .ab { display:flex; gap:18px; transform:rotate(-20deg); }
  .rbtn {
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;

  .pill {
    width:58px; height:16px; border:none; border-radius:8px; background:#33281a; cursor:pointer;

// ---------------- INPUT ----------------
const keys = {};
let waiter = null;
const KEYMAP = { ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT', z:'A', Z:'A', x:'B', X:'B', Enter:'START' };

function press(k){
  initAudio();
  if (waiter && waiter.keys.includes(k)) { const r = waiter.res; waiter = null; r(k); return true; }
  if (G.state === 'world' && !UI.dialog && !UI.menu && k === 'A') { worldInteract(); }
  if (G.state === 'world' && !UI.dialog && !UI.menu && k === 'START') { openPauseMenu(); }
  return false;
}
function waitPress(accept){ return new Promise(res => { waiter = { keys: accept, res }; }); }

addEventListener('keydown', e => {
  const k = KEYMAP[e.key]; if (!k) return;
  e.preventDefault();
  if (!keys[k]) { keys[k] = true; press(k); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); if (!keys[k]) { keys[k] = true; press(k); } };
  const up = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up);
  b.addEventListener('pointercancel', up);
});

// ---------------- AUDIO ----------------
let AC = null;
function initAudio(){ if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } }
function beep(freq, dur=0.08, type='square', vol=0.04, when=0){
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur);
    o.connect(g).connect(AC.destination);
    o.start(AC.currentTime + when); o.stop(AC.currentTime + when + dur + 0.02);
  } catch(e){}
}

// 한국어 조사 처리
function jo(word, a, b){ // a: 받침O (이/을/은/과), b: 받침X (가/를/는/와)
  const c = word.charCodeAt(word.length-1);
  if (c < 0xAC00 || c > 0xD7A3) return word + b;
  return word + (((c - 0xAC00) % 28) ? a : b);
}

function spriteOf(spId){
  const sp = SPECIES[spId], base = SPR[sp.sprite];
  if (!sp.pal) return base;
  return { pal: Object.assign({}, base.pal, sp.pal), px: base.px };
}
function drawSprite(c, spr, x, y, s, flip){
  const rows = spr.px;
  for (let r=0; r<rows.length; r++){
    const line = rows[r];
    for (let q=0; q<line.length; q++){
      const ch = flip ? line[line.length-1-q] : line[q];
      if (ch === '.') continue;
      const col = spr.pal[ch]; if (!col) continue;
      c.fillStyle = col;
      c.fillRect(x+q*s, y+r*s, s, s);
    }
  }
}

// ---------------- 몬스터 인스턴스 ----------------
function statOf(mon, i){ // 0hp 1atk 2def 3spd
  const b = SPECIES[mon.sp].base[i];
  if (i === 0) return Math.floor(b*2*mon.lv/100) + mon.lv + 10;
  return Math.floor(b*2*mon.lv/100) + 5;
}
function expFor(lv){ return lv*lv*lv; }
function movesAtLevel(spId, lv){
  const out = [];
  const learn = SPECIES[spId].learn || {};
  Object.keys(learn).map(Number).sort((a,b)=>a-b).forEach(l => {
    if (l <= lv) learn[l].forEach(m => { if (!out.includes(m)) out.push(m); });
  });
  return out.slice(-4);
}
function createMon(spId, lv){
  const mon = { sp:spId, lv, exp:expFor(lv), moves:[], pp:{}, hp:0 };
  mon.moves = movesAtLevel(spId, lv);
  mon.moves.forEach(m => mon.pp[m] = MOVES[m].pp);
  mon.hp = statOf(mon, 0);
  return mon;
}

// ---------------- 대화/메뉴 (비동기) ----------------
function wrapText(t, max){
  const out = [];
  t.split('\n').forEach(seg => {
    let cur = '';
    for (const ch of seg){
      cur += ch;
      if (cur.length >= max){ out.push(cur); cur=''; }
    }
    if (cur) out.push(cur);
  });
  return out;
}
async function say(text){
  const lines = wrapText(text, 17);
  for (let i=0; i<lines.length; i+=2){
    const page = lines.slice(i, i+2);
    UI.dialog = { lines:page, shown:0, total:page.join('').length, last:i+2>=lines.length };
    while (true){
      const k = await waitPress(['A','B']);
      if (UI.dialog.shown < UI.dialog.total){ UI.dialog.shown = UI.dialog.total; continue; }
      SFX.ok(); break;
    }
  }
  UI.dialog = null;
}
async function sayKeep(text){ // 박스 유지 (배틀 등)
  const lines = wrapText(text, 17);
  for (let i=0; i<lines.length; i+=2){
    const page = lines.slice(i, i+2);
    UI.dialog = { lines:page, shown:0, total:page.join('').length };
    while (true){
      const k = await waitPress(['A','B']);
      if (UI.dialog.shown < UI.dialog.total){ UI.dialog.shown = UI.dialog.total; continue; }
      break;
    }
  }
}
async function choose(opts, o={}){
  UI.menu = Object.assign({}, o, { opts, i:0, cols:o.cols||1 });
  while (true){
    const k = await waitPress(['UP','DOWN','LEFT','RIGHT','A','B']);
    const m = UI.menu, cols = m.cols, n = opts.length;
    if (k==='UP'){ if (m.i-cols>=0){ m.i-=cols; SFX.move(); } }
    else if (k==='DOWN'){ if (m.i+cols<n){ m.i+=cols; SFX.move(); } }
    else if (k==='LEFT'){ if (cols>1 && m.i%cols>0){ m.i--; SFX.move(); } }
    else if (k==='RIGHT'){ if (cols>1 && m.i%cols<cols-1 && m.i+1<n){ m.i++; SFX.move(); } }
    else if (k==='A'){ SFX.ok(); const r=m.i; UI.menu=null; return r; }
    else if (k==='B'){ if (o.cancel!==false){ SFX.cancel(); UI.menu=null; return -1; } }
  }
}

  if (ch==='H' || ch==='S' || ch==='h' || ch==='s'){
    const heal = (ch==='H'||ch==='h');
    c.fillStyle = '#e8e0d0'; c.fillRect(x,y,16,16);
    c.fillStyle = heal ? '#d84838' : '#3868c8';
    c.fillRect(x,y,16,6);
    c.fillStyle = heal ? '#a82818' : '#1f4a9a';
    c.fillRect(x,y+4,16,2);
    if (ch==='h' || ch==='s'){
      c.fillStyle = '#4a3018'; c.fillRect(x+3,y+6,10,10);
      c.fillStyle = '#2a1808'; c.fillRect(x+5,y+8,6,8);
    } else {
      c.fillStyle = '#88b8e8'; c.fillRect(x+3,y+8,4,4); c.fillRect(x+9,y+8,4,4);
      c.fillStyle = '#fff'; c.fillRect(x+3,y+8,2,1); c.fillRect(x+9,y+8,2,1);
    }
    return;
  }
}

// ---------------- 월드 렌더 & 이동 ----------------
function mapAt(map, x, y){
  const t = MAPS[map].tiles;
  if (y<0 || y>=t.length || x<0 || x>=t[0].length) return '#';
  return t[y][x];
}
function npcAt(map, x, y){ return MAPS[map].npcs.find(n => n.x===x && n.y===y); }
function passable(map, x, y){
  const t = MAPS[map].tiles;
  // 맵 경계 밖 = 출구 체크
  if (y < 0) return MAPS[map].exits.top ? 'exit-top' : false;
  if (y >= t.length) return MAPS[map].exits.bottom ? 'exit-bottom' : false;
  if (x < 0 || x >= t[0].length) return false;
  if (SOLID.includes(t[y][x])) return false;
  if (npcAt(map, x, y)) return false;
  return true;
}

function drawWorld(){
  const c = ctx;
  c.save(); c.scale(SC, SC);
  const map = MAPS[G.map], tiles = map.tiles;
  const mw = tiles[0].length*16, mh = tiles.length*16;
  const pxl = G.x*16 + G.mvx, pyl = G.y*16 + G.mvy;
  const camX = clamp(pxl - 72, 0, Math.max(0, mw-160));
  const camY = clamp(pyl - 64, 0, Math.max(0, mh-144));
  const x0 = Math.floor(camX/16), y0 = Math.floor(camY/16);
  for (let ty=y0; ty<=y0+9 && ty<tiles.length; ty++){
    for (let tx=x0; tx<=x0+10 && tx<tiles[0].length; tx++){
      drawTile(c, tiles[ty][tx], tx*16-camX, ty*16-camY, G.frame);
    }
  }
  // NPC
  for (const n of map.npcs){
    const spr = NPC_SPRS[n.spr];
    const set = n.dir==='up' ? spr.up : n.dir==='down' ? spr.down : spr.side;
    drawSprite(c, set[0], n.x*16-camX, n.y*16-camY-2, 1, n.dir==='left');
  }
  // 플레이어
  const pset = G.dir==='up' ? PLAYER_SPR.up : G.dir==='down' ? PLAYER_SPR.down : PLAYER_SPR.side;
  const frame = (G.mvp>0 && G.walkToggle) ? 1 : 0;
  drawSprite(c, pset[frame], pxl-camX, pyl-camY-2, 1, G.dir==='left');
  // 수풀에 서있으면 하반신 가림
  if (mapAt(G.map, G.x, G.y)==='g' && G.mvp===0){
    c.fillStyle = '#4a9a30'; c.fillRect(pxl-camX, pyl-camY+9, 16, 7);
    c.fillStyle = '#357a20';
    for (let i=0;i<4;i++) c.fillRect(pxl-camX+1+i*4, pyl-camY+9, 2, 7);
  }
  c.restore();
  // 맵 이름 라벨
  c.fillStyle = 'rgba(20,30,15,.75)'; c.fillRect(8, 8, 110, 26);
  c.fillStyle = '#f8f0d0'; c.font = 'bold 14px sans-serif'; c.textBaseline='middle'; c.textAlign='left';
  c.fillText(map.name, 18, 22);
}

async function changeMap(target){
  if (G.transit) return;
  G.transit = true;
  UI.fade = 1;
  await new Promise(r => setTimeout(r, 250));
  const ex = target;
  G.map = ex.map;
  const nt = MAPS[ex.map].tiles;
  if (ex.y === 'bottom'){ G.y = nt.length-1; }
  if (ex.y === 'top'){ G.y = 0; }
  UI.fade = 0;
  G.transit = false;
}

function updateWorld(){
  if (UI.dialog || UI.menu || G.state !== 'world') return;
  if (G.mvp > 0){
    G.mvp -= 2;
    const off = 16 - G.mvp;
    G.mvx = G.dir==='left' ? -off : G.dir==='right' ? off : 0;
    G.mvy = G.dir==='up' ? -off : G.dir==='down' ? off : 0;
    if (G.mvp % 8 === 0) G.walkToggle = !G.walkToggle;
    if (G.mvp <= 0){
      // 이동 완료
      if (G.dir==='left') G.x--; else if (G.dir==='right') G.x++;
      else if (G.dir==='up') G.y--; else if (G.dir==='down') G.y++;
      G.mvx = G.mvy = 0;
      onStep();
    }
    return;
  }
  let d = null;
  if (keys.UP) d='up'; else if (keys.DOWN) d='down'; else if (keys.LEFT) d='left'; else if (keys.RIGHT) d='right';
  if (!d) return;
  G.dir = d;
  const nx = G.x + (d==='left'?-1:d==='right'?1:0);
  const ny = G.y + (d==='up'?-1:d==='down'?1:0);
  const p = passable(G.map, nx, ny);
  if (p === 'exit-top'){ changeMap(MAPS[G.map].exits.top); return; }
  if (p === 'exit-bottom'){ changeMap(MAPS[G.map].exits.bottom); return; }
  if (p === true){ G.mvp = 16; }
}

async function onStep(){
  const ch = mapAt(G.map, G.x, G.y);
  if (ch === 'h'){ await healHouse(); return; }
  if (ch === 's'){ await shop(); return; }
  if (ch === 'g' && MAPS[G.map].encounters && G.party.some(m=>m.hp>0)){
    if (Math.random() < 0.13) await wildEncounter();
  }
}

async function worldInteract(){
  const fx = G.x + (G.dir==='left'?-1:G.dir==='right'?1:0);
  const fy = G.y + (G.dir==='up'?-1:G.dir==='down'?1:0);
  const map = MAPS[G.map];
  const sign = map.signs && map.signs[fx+','+fy];
  if (sign){ G.state='dialog'; await say(sign); G.state='world'; return; }
  const npc = npcAt(G.map, fx, fy);
  if (!npc) {
    if (mapAt(G.map, fx, fy) === '~'){ G.state='dialog'; await say('물이 잔잔하게 일렁이고 있다...'); G.state='world'; }
    return;
  }
  // NPC가 플레이어를 바라봄
  npc.dir = G.dir==='up'?'down':G.dir==='down'?'up':G.dir==='left'?'right':'left';
  G.state='dialog';
  if (npc.trainer){
    const flag = 'beat_' + npc.name;
    if (G.flags[flag]){
      for (const t of npc.trainer.after) await say(t);
    } else {
      for (const t of npc.trainer.before) await say(t);
      await startBattle({ trainer: npc });
      return; // startBattle이 state 복구
    }
  } else {
    for (const t of npc.text) await say(t);
  }
  G.state='world';
}

// ---------------- 배틀 시스템 ----------------
let B = null;
function stageMul(s){ return s >= 0 ? (2+s)/2 : 2/(2-s); }

function calcDamage(att, def, mv, attStage, defStage){
  const lvl = att.lv;
  const atk = statOf(att,1) * stageMul(attStage.atk);
  const dfn = Math.max(1, statOf(def,2) * stageMul(defStage.def));
  let dmg = (((2*lvl/5+2) * mv.pow * atk / dfn) / 50) + 2;
  const stab = SPECIES[att.sp].types.includes(mv.type) ? 1.5 : 1;
  const eff = effOf(mv.type, SPECIES[def.sp].types);
  const critChance = mv.crit ? 1/4 : 1/16;
  const crit = Math.random() < critChance ? 2 : 1;
  dmg = dmg * stab * eff * crit * (0.85 + Math.random()*0.15);
  return { dmg: Math.max(1, Math.floor(dmg)), eff, crit: crit>1 };
}

async function animateHP(target, to){
  return new Promise(res => {
    const step = () => {
      if (target.hp === to){ res(); return; }
      target.hp += target.hp > to ? -1 : 1;
      if (Math.abs(target.hp - to) > 8) target.hp += target.hp > to ? -2 : 2;
      if ((target.hp - to) * (target.hp - to) < 4) target.hp = to;
      setTimeout(step, 18);
    };
    step();
  });
}

async function useMove(user, foe, mvName, userStage, foeStage, userSide){
  const mv = MOVES[mvName];
  user.pp[mvName] = Math.max(0, (user.pp[mvName]||0) - 1);
  await sayKeep(`${mName(user)}의\n${mvName}!`);
  if (mv.acc < 999 && rnd(100) >= mv.acc){
    await sayKeep('그러나 빗나갔다!');
    return;
  }
  if (mv.pow > 0){
    const r = calcDamage(user, foe, mv, userStage, foeStage);
    if (r.eff === 0){ await sayKeep('효과가 없는 것 같다...'); return; }
    (r.eff > 1 || r.crit) ? SFX.superhit() : SFX.hit();
    B.shake = userSide === 'p' ? 'e' : 'p';
    setTimeout(()=>{ if(B) B.shake=null; }, 300);
    await animateHP(foe, Math.max(0, foe.hp - r.dmg));
    if (r.crit) await sayKeep('급소에 맞았다!');
    if (r.eff > 1) await sayKeep('효과가 굉장했다!');
    else if (r.eff < 1) await sayKeep('효과가 별로인 듯하다...');
  } else if (mv.stat){
    const tgt = mv.stat.who === 'self' ? user : foe;
    const stg = mv.stat.who === 'self' ? userStage : foeStage;
    for (const k of ['atk','def']){
      if (mv.stat[k] !== undefined){
        const cur = stg[k];
        if ((mv.stat[k] > 0 && cur >= 6) || (mv.stat[k] < 0 && cur <= -6)){
          await sayKeep('그러나 더 이상 변하지 않는다!'); return;
        }
        stg[k] = clamp(cur + mv.stat[k], -6, 6);
      }
    }
    SFX.move();
    await sayKeep(`${mName(tgt)}의\n${mv.msg}`);
  }
}

async function gainExp(mon, foe){
  const e = Math.floor(SPECIES[foe.sp].bexp * foe.lv / 7);
  await sayKeep(`${mName(mon)}${jo(mName(mon),'은','는')}\n경험치 ${e}을 얻었다!`);
  mon.exp += e;
  while (mon.lv < 100 && mon.exp >= expFor(mon.lv+1)){
    const oldMax = statOf(mon, 0);
    mon.lv++;
    mon.hp = Math.min(statOf(mon,0), mon.hp + (statOf(mon,0) - oldMax));
    SFX.levelup();
    await sayKeep(`${mName(mon)}${jo(mName(mon),'은','는')}\n레벨 ${mon.lv}이(가) 되었다!`);
    // 기술 습득
    const learn = SPECIES[mon.sp].learn || {};
    if (learn[mon.lv]){
      for (const nm of learn[mon.lv]){
        if (mon.moves.includes(nm)) continue;
        if (mon.moves.length < 4){
          mon.moves.push(nm); mon.pp[nm] = MOVES[nm].pp;
          await sayKeep(`${mName(mon)}${jo(mName(mon),'은','는')}\n${jo(nm,'을','를')} 배웠다!`);
        } else {
          await sayKeep(`${jo(nm,'을','를')} 배우고 싶지만\n기술이 가득 찼다!`);
          const i = await choose([...mon.moves, '포기한다'], { title:'잊을 기술은?' });
          if (i >= 0 && i < 4){
            const old = mon.moves[i];
            delete mon.pp[old];
            mon.moves[i] = nm; mon.pp[nm] = MOVES[nm].pp;
            await sayKeep(`${jo(old,'을','를')} 잊고\n${jo(nm,'을','를')} 배웠다!`);
          } else {
            await sayKeep(`${jo(nm,'을','를')}\n배우지 않았다.`);
          }
        }
      }
    }
    // 진화 예약
    const evo = SPECIES[mon.sp].evo;
    if (evo && mon.lv >= evo.lv) mon.evolvePending = evo.to;
  }
}

async function checkEvolution(){
  for (const mon of G.party){
    if (!mon.evolvePending) continue;
    const to = mon.evolvePending; delete mon.evolvePending;
    G.state='dialog';
    await say(`어라...?!\n${mName(mon)}의 모습이...!`);
    SFX.evolve();
    UI.flash = 40;
    await new Promise(r=>setTimeout(r, 900));
    const oldName = mName(mon), oldMax = statOf(mon,0);
    mon.sp = to;
    mon.hp = Math.min(statOf(mon,0), mon.hp + (statOf(mon,0)-oldMax));
    G.seen[to]=1; G.caught[to]=1;
    await say(`축하합니다! ${oldName}${jo(oldName,'은','는')}\n${mName(mon)}${jo(mName(mon),'으로','로')} 진화했다!`);
  }
}

function firstHealthy(){ return G.party.find(m => m.hp > 0); }

async function pickSwitch(force){
  while (true){
    const opts = G.party.map(m => `${mName(m)} Lv${m.lv}  HP ${m.hp}/${statOf(m,0)}`);
    if (!force) ;
    const i = await choose(opts, { title:'어느 수호몬?', cancel: !force, w: 300 });
    if (i === -1) return null;
    if (G.party[i].hp <= 0){ await sayKeep('쓰러져서 싸울 수 없다!'); continue; }
    if (B && G.party[i] === B.p){ await sayKeep('이미 나와 있다!'); continue; }
    return i;
  }
}

async function tryCapture(){
  if (B.trainer){ await sayKeep('다른 트레이너의 수호몬은\n잡을 수 없다!'); return false; }
  if (!G.bag['혼구슬']){ await sayKeep('혼구슬이 없다!'); return false; }
  G.bag['혼구슬']--;
  SFX.throwball();
  await sayKeep(`${mName(B.e)}에게\n혼구슬을 던졌다!`);
  const M = statOf(B.e,0), H = B.e.hp, rate = SPECIES[B.e.sp].catch;
  const a = Math.floor((3*M - 2*H) * rate / (3*M));
  const caught = rnd(256) < a;
  const shakes = caught ? 3 : Math.min(2, Math.floor(a / 80));
  B.ball = true;
  for (let i=0; i<=shakes; i++){
    await new Promise(r=>setTimeout(r, 500));
    SFX.shake();
  }
  B.ball = false;
  if (caught){
    SFX.catch();
    await sayKeep(`신난다!\n${jo(mName(B.e),'을','를')} 잡았다!`);
    G.caught[B.e.sp] = 1;
    if (G.party.length < 6){ G.party.push(B.e); }
    else { G.box.push(B.e); await sayKeep(`지닌 수호몬이 가득 차서\n보관함으로 보냈다.`); }
    return true;
  }
  await sayKeep('아앗! 아깝다!\n빠져나와 버렸다!');
  return false;
}

async function battleBag(){
  while (true){
    const items = Object.keys(G.bag).filter(k => G.bag[k] > 0);
    if (!items.length){ await sayKeep('가방이 비어 있다!'); return false; }
    const i = await choose(items.map(k => `${k}  x${G.bag[k]}`), { title:'가방', w:260 });
    if (i === -1) return false;
    const it = items[i];
    if (it === '혼구슬'){ return await tryCapture() ? 'caught' : 'used'; }
    const heal = it === '회복약' ? 50 : 120;
    if (B.p.hp >= statOf(B.p,0)){ await sayKeep('HP가 가득 차 있다!'); continue; }
    G.bag[it]--;
    SFX.heal();
    await animateHP(B.p, Math.min(statOf(B.p,0), B.p.hp + heal));
    await sayKeep(`${mName(B.p)}의\nHP가 회복되었다!`);
    return 'used';
  }
}

async function wildEncounter(){
  const enc = MAPS[G.map].encounters;
  const total = enc.reduce((s,e)=>s+e.w, 0);
  let r = rnd(total), pick = enc[0];
  for (const e of enc){ if (r < e.w){ pick = e; break; } r -= e.w; }
  const lv = pick.lv[0] + rnd(pick.lv[1]-pick.lv[0]+1);
  await startBattle({ wild: createMon(pick.sp, lv) });
}

async function startBattle(opt){
  G.state = 'battle';
  SFX.encounter();
  UI.flash = 30;
  await new Promise(r=>setTimeout(r, 700));
  const trainer = opt.trainer || null;
  let tIdx = 0;
  const emon = trainer ? createMon(trainer.trainer.party[0].sp, trainer.trainer.party[0].lv) : opt.wild;
  B = {
    p: firstHealthy(), e: emon, trainer,
    ps:{atk:0,def:0}, es:{atk:0,def:0},
    runTries: 0, shake:null, ball:false,
  };
  G.seen[B.e.sp] = 1;
  if (trainer) await sayKeep(`${trainer.name}${jo(trainer.name,'이','가')}\n승부를 걸어왔다!`);
  else await sayKeep(`앗! 야생의\n${mName(B.e)}${jo(mName(B.e),'이','가')} 나타났다!`);
  await sayKeep(`가랏! ${mName(B.p)}!`);

  let result = null; // 'win' 'lose' 'run' 'caught'
  battleLoop:
  while (true){
    // 플레이어 커맨드
    let pAction = null;
    cmdLoop:
    while (true){
      UI.dialog = { lines:[`${mName(B.p)}${jo(mName(B.p),'은','는')}`, '무엇을 할까?'], shown:99, total:0 };
      const c = await choose(['싸운다','가방','수호몬','도망친다'], { cols:2, battle:true, cancel:false });
      if (c === 0){
        const mvs = B.p.moves;
        const mi = await choose(mvs.map(m => `${m}`), { title:'기술', battleMoves:true, mon:B.p });
        if (mi === -1) continue;
        if ((B.p.pp[mvs[mi]]||0) <= 0){ await sayKeep('기술의 PP가 남아있지 않다!'); continue; }
        pAction = { type:'move', mv: mvs[mi] }; break;
      }
      if (c === 1){
        const r = await battleBag();
        if (r === 'caught'){ result='caught'; break battleLoop; }
        if (r === 'used'){ pAction = { type:'pass' }; break; }
        continue;
      }
      if (c === 2){
        const i = await pickSwitch(false);
        if (i === null) continue;
        await sayKeep(`돌아와, ${mName(B.p)}!`);
        B.p = G.party[i]; B.ps = {atk:0,def:0};
        await sayKeep(`가랏! ${mName(B.p)}!`);
        pAction = { type:'pass' }; break;
      }
      if (c === 3){
        if (B.trainer){ await sayKeep('승부 도중에는\n도망칠 수 없다!'); continue; }
        B.runTries++;
        const f = Math.floor(statOf(B.p,3)*128 / Math.max(1,statOf(B.e,3))) + 30*B.runTries;
        if (rnd(256) < f){ await sayKeep('무사히 도망쳤다!'); result='run'; break battleLoop; }
        await sayKeep('도망칠 수 없었다!');
        pAction = { type:'pass' }; break;
      }
    }
    // 적 행동
    const usable = B.e.moves.filter(m => (B.e.pp[m]||0) > 0);
    const eMv = usable.length ? usable[rnd(usable.length)] : null;
    // 순서 결정
    const pPri = pAction.type==='move' ? (MOVES[pAction.mv].pri||0) : 99;
    const ePri = eMv ? (MOVES[eMv].pri||0) : 0;
    let order;
    if (pAction.type !== 'move') order = ['e'];
    else if (pPri !== ePri) order = pPri > ePri ? ['p','e'] : ['e','p'];
    else order = statOf(B.p,3)*stageMul(0) >= statOf(B.e,3) ? ['p','e'] : ['e','p'];
    if (pAction.type !== 'move' && eMv) order = ['e'];

    for (const side of order){
      if (side==='p'){
        await useMove(B.p, B.e, pAction.mv, B.ps, B.es, 'p');
        if (B.e.hp <= 0){
          SFX.faint();
          await sayKeep(`상대 ${mName(B.e)}${jo(mName(B.e),'은','는')}\n쓰러졌다!`);
          await gainExp(B.p, B.e);
          if (B.trainer && ++tIdx < B.trainer.trainer.party.length){
            const nx = B.trainer.trainer.party[tIdx];
            B.e = createMon(nx.sp, nx.lv); B.es = {atk:0,def:0};
            G.seen[B.e.sp] = 1;
            await sayKeep(`${B.trainer.name}${jo(B.trainer.name,'이','가')}\n${jo(mName(B.e),'을','를')} 내보냈다!`);
            break;
          }
          result='win'; break battleLoop;
        }
      } else if (eMv){
        await useMove(B.e, B.p, eMv, B.es, B.ps, 'e');
        if (B.p.hp <= 0){
          SFX.faint();
          await sayKeep(`${mName(B.p)}${jo(mName(B.p),'은','는')}\n쓰러졌다!`);
          if (firstHealthy()){
            const i = await pickSwitch(true);
            B.p = G.party[i]; B.ps = {atk:0,def:0};
            await sayKeep(`가랏! ${mName(B.p)}!`);
            break;
          }
          result='lose'; break battleLoop;
        }
      }
    }
  }
  // 종료 처리
  if (result === 'win' && B.trainer){
    const tr = B.trainer.trainer;
    await sayKeep(B.trainer.trainer.lose);
    SFX.money();
    await sayKeep(`승리하여 상금\n${tr.reward}원을 받았다!`);
    G.money += tr.reward;
    G.flags['beat_' + B.trainer.name] = true;
  }
  B = null;
  UI.dialog = null;
  G.state = 'world';
  if (result === 'lose'){
    G.state='dialog';
    await say('눈앞이 깜깜해졌다...');
    G.party.forEach(m => { m.hp = statOf(m,0); m.moves.forEach(v => m.pp[v]=MOVES[v].pp); });
    G.map='town'; G.x=10; G.y=13; G.dir='down';
    G.money = Math.floor(G.money/2);
    await say('새싹마을로 옮겨졌다.\n(소지금이 절반이 되었다...)');
    G.state='world';
  } else {
    await checkEvolution();
    G.state='world';
  }
}

// ---------------- 배틀 렌더 ----------------
function hpColor(r){ return r > .5 ? '#48c848' : r > .2 ? '#f8c818' : '#e83828'; }
function drawHPBar(x, y, w, mon){
  const r = clamp(mon.hp / statOf(mon,0), 0, 1);
  ctx.fillStyle = '#404040'; ctx.fillRect(x, y, w, 10);
  ctx.fillStyle = '#181818'; ctx.fillRect(x+2, y+2, w-4, 6);
  ctx.fillStyle = hpColor(r); ctx.fillRect(x+2, y+2, Math.round((w-4)*r), 6);
}
function drawBattle(){
  const c = ctx;
  // 배경
  const grd = c.createLinearGradient(0,0,0,300);
  grd.addColorStop(0,'#d8ecc0'); grd.addColorStop(1,'#b8d8a0');
  c.fillStyle = grd; c.fillRect(0,0,480,310);
  // 플랫폼
  c.fillStyle = '#a0c080'; c.beginPath(); c.ellipse(355, 165, 95, 26, 0, 0, 7); c.fill();
  c.fillStyle = '#90b070'; c.beginPath(); c.ellipse(110, 300, 110, 30, 0, 0, 7); c.fill();
  if (!B) return;
  const shakeE = B.shake==='e' ? rnd(7)-3 : 0;
  const shakeP = B.shake==='p' ? rnd(7)-3 : 0;
  // 적
  if (B.ball){
    c.fillStyle = '#d83030'; c.beginPath(); c.arc(355, 140, 14, Math.PI, 0); c.fill();
    c.fillStyle = '#f0f0f0'; c.beginPath(); c.arc(355, 140, 14, 0, Math.PI); c.fill();
    c.fillStyle = '#282828'; c.fillRect(341, 137, 28, 5);
    c.beginPath(); c.arc(355,140,5,0,7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(355,140,2.5,0,7); c.fill();
  } else if (B.e.hp > 0){
    drawSprite(c, spriteOf(B.e.sp), 355-40+shakeE, 90, 5, false);
  }
  // 아군 (등 - 좌우반전 + 확대)
  if (B.p.hp > 0) drawSprite(c, spriteOf(B.p.sp), 110-48+shakeP, 215, 6, true);
  // 적 정보창
  c.fillStyle = '#f8f0d8'; c.fillRect(16, 16, 220, 64);
  c.strokeStyle = '#403828'; c.lineWidth = 3; c.strokeRect(16, 16, 220, 64);
  c.fillStyle = '#282018'; c.font = 'bold 17px sans-serif'; c.textAlign='left'; c.textBaseline='alphabetic';
  c.fillText(mName(B.e), 28, 40);
  c.fillText(':L' + B.e.lv, 168, 40);
  c.font = 'bold 12px sans-serif'; c.fillText('HP', 28, 62);
  drawHPBar(52, 52, 160, B.e);
  if (G.caught[B.e.sp] && !B.trainer){ c.fillStyle='#c03030'; c.beginPath(); c.arc(150,36,5,0,7); c.fill(); }
  // 아군 정보창
  c.fillStyle = '#f8f0d8'; c.fillRect(244, 220, 220, 86);
  c.strokeStyle = '#403828'; c.strokeRect(244, 220, 220, 86);
  c.fillStyle = '#282018'; c.font = 'bold 17px sans-serif';
  c.fillText(mName(B.p), 256, 244);
  c.fillText(':L' + B.p.lv, 396, 244);
  c.font = 'bold 12px sans-serif'; c.fillText('HP', 256, 266);
  drawHPBar(280, 256, 160, B.p);
  c.font = 'bold 14px sans-serif';
  c.fillText(`${B.p.hp}/ ${statOf(B.p,0)}`, 330, 284);
  // EXP 바
  const cur = expFor(B.p.lv), nxt = expFor(B.p.lv+1);
  const er = clamp((B.p.exp-cur)/(nxt-cur), 0, 1);
  c.fillStyle = '#404040'; c.fillRect(280, 292, 160, 6);
  c.fillStyle = '#48a8e8'; c.fillRect(282, 293, 156*er, 4);
}

// ---------------- 시설 & 메뉴 ----------------
async function healHouse(){
  G.state='dialog';
  await say('어서 오세요!\n여기는 수호몬 회복의 집입니다.');
  const i = await choose(['네, 부탁해요','아니오'], { title:'회복할까요?' });
  if (i === 0){
    G.party.forEach(m => { m.hp = statOf(m,0); m.moves.forEach(v => m.pp[v]=MOVES[v].pp); });
    SFX.heal();
    await say('수호몬들이 모두\n기운을 되찾았습니다!');
    await say('또 오세요!');
  }
  G.y++; G.dir='down'; // 문에서 한 칸 내려옴
  G.state='world';
}
async function shop(){
  G.state='dialog';
  await say('어서 오세요!\n무엇을 드릴까요?');
  while (true){
    const names = Object.keys(ITEMS);
    const i = await choose(names.map(n => `${n}  ${ITEMS[n].price}원`), { title:`소지금 ${G.money}원`, w:300 });
    if (i === -1) break;
    const it = names[i];
    await say(ITEMS[it].desc + '.');
    if (G.money < ITEMS[it].price){ await say('돈이 부족합니다...'); continue; }
    const q = await choose(['1개 산다','5개 산다','그만둔다'], { title:'몇 개?' });
    if (q === -1 || q === 2) continue;
    const n = q === 0 ? 1 : 5;
    const cost = ITEMS[it].price * n;
    if (G.money < cost){ await say('돈이 부족합니다...'); continue; }
    G.money -= cost;
    G.bag[it] = (G.bag[it]||0) + n;
    SFX.money();
    await say(`${it} ${n}개,\n감사합니다!`);
  }
  await say('또 오세요!');
  G.y++; G.dir='down';
  G.state='world';
}

async function openPauseMenu(){
  G.state='menu';
  SFX.ok();
  while (true){
    const c = await choose(['도감','수호몬','가방','저장','닫기'], { x:330, y:14, w:136 });
    if (c === -1 || c === 4) break;
    if (c === 0) await showDex();
    if (c === 1) await partyMenu();
    if (c === 2) await bagMenu();
    if (c === 3) await saveGame();
  }
  G.state='world';
}
async function showDex(){
  const seen = Object.keys(G.seen).length, caught = Object.keys(G.caught).length;
  await say(`수호몬 도감\n본 수: ${seen}  잡은 수: ${caught}`);
  while (true){
    const opts = DEX_ORDER.map((id,i) => {
      const no = String(i+1).padStart(2,'0');
      if (G.caught[id]) return `No.${no} ● ${SPECIES[id].name}`;
      if (G.seen[id]) return `No.${no} ○ ${SPECIES[id].name}`;
      return `No.${no}   ?????`;
    });
    const i = await choose(opts, { title:'도감', w:280 });
    if (i === -1) return;
    const id = DEX_ORDER[i];
    if (!G.seen[id]){ await say('아직 만난 적이 없다.'); continue; }
    const sp = SPECIES[id];
    await say(`${sp.name}  [${sp.types.join('/')}]`);
    if (G.caught[id]) await say(sp.dex);
    else await say('잡으면 자세한 정보가\n기록된다.');
  }
}
async function partyMenu(){
  while (true){
    const opts = G.party.map(m => `${mName(m)} Lv${m.lv}  ${m.hp}/${statOf(m,0)}`);
    const i = await choose(opts, { title:'수호몬', w:300 });
    if (i === -1) return;
    const m = G.party[i];
    const a = await choose(['상태 보기','순서 바꾸기','돌아가기'], {});
    if (a === 0){
      await say(`${mName(m)}  Lv${m.lv}  [${SPECIES[m.sp].types.join('/')}]\nHP ${m.hp}/${statOf(m,0)}  공격 ${statOf(m,1)}  방어 ${statOf(m,2)}  스피드 ${statOf(m,3)}`);
      await say('기술: ' + m.moves.map(v=>`${v}(${m.pp[v]}/${MOVES[v].pp})`).join(', '));
    }
    if (a === 1){
      if (G.party.length < 2){ await say('바꿀 상대가 없다.'); continue; }
      const j = await choose(G.party.map(x => mName(x)+' Lv'+x.lv), { title:'누구와 바꿀까?' });
      if (j >= 0 && j !== i){ const t = G.party[i]; G.party[i]=G.party[j]; G.party[j]=t; SFX.ok(); }
    }
  }
}
async function bagMenu(){
  while (true){
    const items = Object.keys(G.bag).filter(k => G.bag[k] > 0);
    if (!items.length){ await say('가방이 비어 있다.'); return; }
    const i = await choose(items.map(k => `${k}  x${G.bag[k]}`), { title:`소지금 ${G.money}원`, w:280 });
    if (i === -1) return;
    const it = items[i];
    if (it === '혼구슬'){ await say('야생 수호몬과의 배틀에서\n사용할 수 있다.'); continue; }
    const heal = it === '회복약' ? 50 : 120;
    const j = await choose(G.party.map(m => `${mName(m)}  ${m.hp}/${statOf(m,0)}`), { title:'누구에게?' });
    if (j === -1) continue;
    const m = G.party[j];
    if (m.hp <= 0){ await say('쓰러진 수호몬에게는\n사용할 수 없다!'); continue; }
    if (m.hp >= statOf(m,0)){ await say('HP가 가득 차 있다!'); continue; }
    G.bag[it]--;
    m.hp = Math.min(statOf(m,0), m.hp + heal);
    SFX.heal();
    await say(`${mName(m)}의\nHP가 회복되었다!`);
  }
}

// ---------------- 저장 / 불러오기 ----------------
async function saveGame(){
  const data = JSON.stringify({
    map:G.map, x:G.x, y:G.y, dir:G.dir, money:G.money,
    party:G.party, box:G.box, bag:G.bag, flags:G.flags, seen:G.seen, caught:G.caught,
  });
  try {
    if (window.storage){
      await window.storage.set('soohomon_gold_save', data);
      SFX.save();
      await say('일지에 기록했다!\n(저장 완료)');
      return;
    }
  } catch(e){}
  await say('이 환경에서는 저장 기능을\n사용할 수 없습니다...');
}
async function loadGame(){
  try {
    if (!window.storage) return null;
    const r = await window.storage.get('soohomon_gold_save');
    if (r && r.value) return JSON.parse(r.value);
  } catch(e){}
  return null;
}

// ---------------- UI 오버레이 렌더 ----------------
function drawBox(x, y, w, h){
  ctx.fillStyle = '#f8f0d8'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#403828'; ctx.lineWidth = 3; ctx.strokeRect(x+1.5, y+1.5, w-3, h-3);
  ctx.strokeStyle = '#a89878'; ctx.lineWidth = 1; ctx.strokeRect(x+5.5, y+5.5, w-11, h-11);
}
function drawDialog(){
  const d = UI.dialog; if (!d) return;
  drawBox(8, 320, 464, 104);
  ctx.fillStyle = '#282018'; ctx.font = 'bold 21px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  if (d.shown < d.total) d.shown = Math.min(d.total, d.shown + 1.2);
  let left = Math.floor(d.shown);
  for (let i=0; i<d.lines.length; i++){
    const ln = d.lines[i];
    const vis = ln.slice(0, Math.max(0, left));
    left -= ln.length;
    ctx.fillText(vis, 28, 360 + i*32);
  }
  if (d.shown >= d.total && G.frame % 50 < 30){
    ctx.fillStyle = '#a02818';
    ctx.beginPath(); ctx.moveTo(444,404); ctx.lineTo(458,404); ctx.lineTo(451,414); ctx.fill();
  }
}
function drawMenu(){
  const m = UI.menu; if (!m) return;
  if (m.battle){
    drawBox(244, 320, 228, 104);
    ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#282018'; ctx.textAlign='left';
    m.opts.forEach((o,i) => {
      const col = i % 2, row = Math.floor(i/2);
      const x = 268 + col*110, y = 356 + row*42;
      ctx.fillText(o, x, y);
      if (m.i === i){ ctx.fillStyle='#a02818'; ctx.beginPath(); ctx.moveTo(x-16,y-14); ctx.lineTo(x-16,y); ctx.lineTo(x-6,y-7); ctx.fill(); ctx.fillStyle='#282018'; }
    });
    return;
  }
  if (m.battleMoves){
    drawBox(8, 296, 464, 128);
    ctx.font = 'bold 19px sans-serif'; ctx.textAlign='left';
    m.opts.forEach((o,i) => {
      const x = 40, y = 326 + i*24;
      ctx.fillStyle = '#282018';
      ctx.fillText(o, x, y);
      const mv = MOVES[m.mon.moves[i]];
      ctx.fillStyle = TYPES[mv.type]; ctx.fillRect(220, y-15, 58, 18);
      ctx.fillStyle = '#fff'; ctx.font='bold 13px sans-serif';
      ctx.fillText(mv.type, 228, y-2);
      ctx.fillStyle = '#282018'; ctx.font = 'bold 19px sans-serif';
      ctx.fillText(`PP ${m.mon.pp[m.mon.moves[i]]}/${mv.pp}`, 320, y);
      ctx.fillText(mv.pow ? '위력 '+mv.pow : '변화', 408 - (mv.pow?14:0), y);
      if (m.i === i){ ctx.fillStyle='#a02818'; ctx.beginPath(); ctx.moveTo(20,y-14); ctx.lineTo(20,y); ctx.lineTo(30,y-7); ctx.fill(); }
    });
    return;
  }
  const w = m.w || 200;
  const lineH = 30;
  const h = m.opts.length*lineH + 26 + (m.title ? 26 : 0);
  const x = m.x !== undefined ? m.x : 240 - w/2;
  const y = m.y !== undefined ? m.y : Math.max(10, 300 - h);
  drawBox(x, y, w, h);
  ctx.textAlign = 'left'; ctx.textBaseline='alphabetic';
  let ty = y + 30;
  if (m.title){ ctx.fillStyle = '#8a3018'; ctx.font='bold 15px sans-serif'; ctx.fillText(m.title, x+18, ty-4); ty += 26; }
  ctx.font = 'bold 18px sans-serif';
  m.opts.forEach((o,i) => {
    ctx.fillStyle = '#282018';
    ctx.fillText(o, x+34, ty + i*lineH - 6);
    if (m.i === i){ ctx.fillStyle='#a02818'; ctx.beginPath(); ctx.moveTo(x+14, ty+i*lineH-20); ctx.lineTo(x+14, ty+i*lineH-6); ctx.lineTo(x+24, ty+i*lineH-13); ctx.fill(); }
  });
}

// ---------------- 타이틀 & 인트로 ----------------
function drawTitle(){
  const c = ctx;
  const g = c.createLinearGradient(0,0,0,432);
  g.addColorStop(0,'#1a1430'); g.addColorStop(.55,'#3a2a14'); g.addColorStop(1,'#0e0a06');
  c.fillStyle = g; c.fillRect(0,0,480,432);
  // 반짝이
  for (let i=0;i<24;i++){
    const sx = (i*199)%480, sy = (i*83)%240;
    if ((G.frame+i*13)%120 < 60){ c.fillStyle='rgba(255,230,150,.7)'; c.fillRect(sx,sy,2,2); }
  }
  // 미르 실루엣
  drawSprite(c, spriteOf(15), 168, 64, 9, false);
  c.font = '900 56px sans-serif'; c.textAlign='center'; c.textBaseline='alphabetic';
  c.fillStyle = '#3a2606';
  c.fillText('수호몬', 243, 287);
  const gg = c.createLinearGradient(0, 230, 0, 290);
  gg.addColorStop(0,'#fff0b0'); gg.addColorStop(.5,'#f0c030'); gg.addColorStop(1,'#a87010');
  c.fillStyle = gg;
  c.fillText('수호몬', 240, 284);
  c.font = '900 30px sans-serif';
  c.fillStyle = '#3a2606'; c.fillText('— GOLD —', 242, 327);
  c.fillStyle = '#f8d048'; c.fillText('— GOLD —', 240, 325);
  if (G.frame % 60 < 36){
    c.font = 'bold 18px sans-serif'; c.fillStyle = '#f8f0d0';
    c.fillText('A 버튼 (Z) 을 눌러 시작', 240, 392);
  }
  c.font = '11px sans-serif'; c.fillStyle = '#887850';
  c.fillText('© 2026 SOOHOMON PROJECT · 오리지널 작품', 240, 420);
}

async function titleSequence(){
  await waitPress(['A','START']);
  SFX.ok();
  const save = await loadGame();
  G.state = 'titlemenu';
  let c = 0;
  if (save){
    c = await choose(['이어서 한다','새로 시작한다'], { x:140, y:330, w:200, cancel:false });
    if (c === 0){
      Object.assign(G, save);
      G.mvx=G.mvy=0; G.mvp=0;
      G.state='world';
      G.state='dialog';
      await say('모험을 이어서 시작합니다!');
      G.state='world';
      return;
    }
  }
  await intro();
}

async function intro(){
  G.state = 'intro';
  await say('안녕! 만나서 반갑구나.\n나는 수호몬 연구가 솔잎박사란다.');
  await say('이 세계에는 수호몬이라 불리는\n신비한 생물들이 살고 있지.');
  await say('사람들은 수호몬과 함께 살아가고,\n때로는 함께 승부를 펼치기도 한단다.');
  await say('오늘부터 네 모험이 시작된다!\n자, 첫 동료를 골라 보거라.');
  while (true){
    const i = await choose(['불도치 (불꽃 타입)','물방개 (물 타입)','풀쑥이 (풀 타입)'], { title:'어느 수호몬?', w:280, cancel:false });
    const spId = [1,3,5][i];
    G.state = 'starterPreview'; G.previewSp = spId;
    await say(SPECIES[spId].dex);
    const ok = await choose(['이 아이로 정한다!','다시 고른다'], { cancel:false });
    if (ok === 0){
      const mon = createMon(spId, 5);
      G.party = [mon];
      G.seen[spId]=1; G.caught[spId]=1;
      SFX.catch();
      await say(`${jo(mName(mon),'을','를')} 동료로 맞이했다!`);
      break;
    }
    G.state='intro';
  }
  await say('회복약과 혼구슬도 조금 챙겨주마.\n북쪽 1번도로에서 동료를 늘려 보거라!');
  await say('그럼, 좋은 여행이 되길!\n(START 또는 Enter 키로 메뉴를 열 수 있다)');
  G.state = 'world';
}

function drawIntro(){
  const c = ctx;
  c.fillStyle = '#e8e0c8'; c.fillRect(0,0,480,432);
  c.fillStyle = '#d0c8a8';
  for (let i=0;i<480;i+=32) c.fillRect(i,0,16,432);
  if (G.state === 'starterPreview' && G.previewSp){
    drawSprite(c, spriteOf(G.previewSp), 176, 60, 8, false);
  } else {
    drawSprite(c, NPC_SPRS.prof.down[0], 200, 70, 10, false);
  }
}

// ---------------- 메인 루프 ----------------
function loop(){
  G.frame++;
  updateWorld();
  ctx.clearRect(0,0,480,432);
  if (G.state === 'title'){ drawTitle(); }
  else if (G.state === 'titlemenu'){ drawTitle(); }
  else if (G.state === 'intro' || G.state === 'starterPreview'){ drawIntro(); }
  else if (G.state === 'battle'){ drawBattle(); }
  else { drawWorld(); }
  drawDialog();
  drawMenu();
  if (UI.flash > 0){
    UI.flash--;
    if (Math.floor(UI.flash/5) % 2 === 0){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,480,432); }
  }
  if (UI.fade > 0){ ctx.fillStyle = '#000'; ctx.fillRect(0,0,480,432); }
  requestAnimationFrame(loop);
}
loop();
titleSequence();
</script>
